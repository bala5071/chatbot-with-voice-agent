# Gateway backend config for the chat app: the three Llama tiers behind one Ollama.
#
# The same as the gateway's examples/backends.ollama.yaml except `endpoint: chat`, so each
# prompt reaches the model as a user message wrapped in the model's chat template; instruct
# models answer more naturally that way. Pass it to the gateway with GATEWAY_BACKENDS:
#
#   ollama pull llama3.2:1b-instruct-q4_K_M && ollama pull llama3.2:3b && ollama pull llama3.1:8b
#   # in the gateway repository
#   GATEWAY_BACKENDS=../chatbot-with-voice-agent/config/backends.ollama-chat.yaml \
#     uv run uvicorn gateway.app:create_default_app --factory --port 8000
#
# With this backend the gateway uses its PassthroughWorker: Ollama does the batching and
# caching. See the gateway's docs/12-real-models.md.
backend: llamacpp

llamacpp:
  endpoint: chat
  max_in_flight: 8
  servers:
    economy:
      url: http://127.0.0.1:11434
      model: llama3.2:1b-instruct-q4_K_M
    standard:
      url: http://127.0.0.1:11434
      model: llama3.2:3b
    premium:
      url: http://127.0.0.1:11434
      model: llama3.1:8b
