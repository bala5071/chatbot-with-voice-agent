# The model files this repo downloads, pinned to an exact Hugging Face commit, with the
# published hash of every file. scripts/fetch_models.py fetches them into models/ (git-ignored)
# and refuses any file whose hash differs. Licenses: docs/licenses.md.
#
# LFS files are checked against the SHA-256 Hugging Face publishes for them. Small non-LFS
# files have no published SHA-256, so they are checked against their published git blob id
# (SHA-1 of "blob <size>\0" + content); their SHA-256 is recorded here after that check.

