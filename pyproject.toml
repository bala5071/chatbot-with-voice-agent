[project]
name = "voice-agent"
version = "0.1.0"
description = "A push-to-talk voice receptionist for a mock clinic, in front of the inference gateway."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Every runtime dependency, direct and transitive, is in docs/licenses.md
# (tests/test_licenses.py checks it against uv.lock).
dependencies = [
    # faster-whisper 1.2.1 calls av.open(..., metadata_errors=...), which av 19 removed.
    "av==16.0.1",
    "faster-whisper==1.2.1",
    "httpx==0.28.1",
    "piper-tts==1.8.0",
]

[project.scripts]
voice-agent = "voice_agent.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "TID", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
# The one module allowed to read real time (CLAUDE.md, hard rule 1).
"src/voice_agent/clock.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "Use the injected Clock (see CLAUDE.md hard rules)."
"time.time".msg = "Use the injected Clock (see CLAUDE.md hard rules)."
"time.time_ns".msg = "Use the injected Clock (see CLAUDE.md hard rules)."
"time.monotonic".msg = "Use the injected Clock (see CLAUDE.md hard rules)."
"time.monotonic_ns".msg = "Use the injected Clock (see CLAUDE.md hard rules)."
"time.perf_counter".msg = "Use the injected Clock (see CLAUDE.md hard rules)."
"time.perf_counter_ns".msg = "Use the injected Clock (see CLAUDE.md hard rules)."
"asyncio.sleep".msg = "Use the injected Clock (see CLAUDE.md hard rules)."
"datetime.datetime.now".msg = "Use the injected Clock (see CLAUDE.md hard rules)."
"datetime.datetime.utcnow".msg = "Use the injected Clock (see CLAUDE.md hard rules)."

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "real_models: needs the downloaded models (and a GPU or a slow CPU); skipped unless VOICE_REAL_MODELS=1",
]

# faster-whisper ships no type information; only engines/faster_whisper.py imports it, and
# what it returns is typed there by hand.
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true
