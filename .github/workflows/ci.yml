name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  # The client against the real gateway (its simulated backend; no model runs), so the fake
  # gateway used by the other tests cannot drift from it unnoticed.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: bala5071/Multi-Model-Inference-Gateway-Simulator
          path: gateway

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Start the gateway
        working-directory: gateway
        run: |
          uv sync --locked
          nohup uv run uvicorn gateway.app:create_default_app --factory --port 8000 > ../gateway.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          cat ../gateway.log; exit 1

      - name: Contract tests
        working-directory: backend
        env:
          CHAT_TEST_GATEWAY_URL: http://127.0.0.1:8000
        run: |
          uv sync --locked
          uv run pytest -m gateway -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint, format, types, tests
        run: npm run check

      - name: Build
        run: npm run build

  # Browser smoke tests: the built page, the chat backend, and the fake gateway.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the backend
        working-directory: backend
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend and a browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke tests
        working-directory: frontend
        run: npm run e2e

      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/e2e/results
