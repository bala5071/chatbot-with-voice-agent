name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Fakes only: no model is downloaded and nothing reaches the network beyond installing
  # packages. Tests marked real_models are skipped (VOICE_REAL_MODELS is never set here).
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      - name: Printable ASCII in tracked code
        run: uv run python scripts/check_characters.py
